document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

sans-serif;color:rgba(247,248,246,.55);margin-top:8px\">Acción, guardado<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#A8451C;padding:16px 14px 14px;height:96px;box-sizing:border-box\">\n          <div style=\"font:600 12px Montserrat,sans-serif;color:#F7F8F6\">señal<\u002Fdiv>\n          <div style=\"font:400 10.5px 'IBM Plex Mono',monospace;color:rgba(247,248,246,.6);margin-top:3px\">#A8451C<\u002Fdiv>\n          <div style=\"font:400 10px/1.4 Montserrat,sans-serif;color:rgba(247,248,246,.6);margin-top:8px\">Solo atraso y fallo<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#F7F8F6;padding:16px 14px 14px;height:96px;box-sizing:border-box\">\n          <div style=\"font:600 12px Montserrat,sans-serif;color:#12211A\">fondo<\u002Fdiv>\n          <div style=\"font:400 10.5px 'IBM Plex Mono',monospace;color:rgba(18,33,26,.5);margin-top:3px\">#F7F8F6<\u002Fdiv>\n          <div style=\"font:400 10px/1.4 Montserrat,sans-serif;color:rgba(18,33,26,.5);margin-top:8px\">Lienzo de la app<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#FFFFFF;padding:16px 14px 14px;height:96px;box-sizing:border-box\">\n          <div style=\"font:600 12px Montserrat,sans-serif;color:#12211A\">papel<\u002Fdiv>\n          <div style=\"font:400 10.5px 'IBM Plex Mono',monospace;color:rgba(18,33,26,.5);margin-top:3px\">#FFFFFF<\u002Fdiv>\n          <div style=\"font:400 10px/1.4 Montserrat,sans-serif;color:rgba(18,33,26,.5);margin-top:8px\">Hojas, sheets<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#DCE0DA;padding:16px 14px 14px;height:96px;box-sizing:border-box\">\n          <div style=\"font:600 12px Montserrat,sans-serif;color:#12211A\">línea<\u002Fdiv>\n          <div style=\"font:400 10.5px 'IBM Plex Mono',monospace;color:rgba(18,33,26,.5);margin-top:3px\">#DCE0DA<\u002Fdiv>\n          <div style=\"font:400 10px/1.4 Montserrat,sans-serif;color:rgba(18,33,26,.5);margin-top:8px\">Reglas, bordes<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"dv-note\" style=\"max-width:520px\">Sin crema, sin terracota de fondo. El naranja quemado existe únicamente como tinta de atraso y de fallo: si aparece, algo pide atención. Los ocho equipos usan puntos derivados del verde con matiz variable y misma luminosidad — el color nunca es el único portador de información.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"width:400px\">\n      <div style=\"font:600 10px/1 'IBM Plex Mono',monospace;letter-spacing:.04em;color:rgba(18,33,26,.45);margin-bottom:14px\">TIPOGRAFÍA — Montserrat<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column\">\n        <div style=\"display:flex;align-items:baseline;gap:14px;padding:10px 0;border-bottom:1px solid #DCE0DA\"><span style=\"font:400 9.5px 'IBM Plex Mono',monospace;color:rgba(18,33,26,.4);width:96px;flex:none\">28 / 600 / -.02em<\u002Fspan><span style=\"font:600 28px/1.1 Montserrat,sans-serif;color:#12211A\">Hoy<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:baseline;gap:14px;padding:10px 0;border-bottom:1px solid #DCE0DA\"><span style=\"font:400 9.5px 'IBM Plex Mono',monospace;color:rgba(18,33,26,.4);width:96px;flex:none\">20 / 600<\u002Fspan><span style=\"font:600 20px/1.2 Montserrat,sans-serif;color:#12211A\">Título de tarea<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:baseline;gap:14px;padding:10px 0;border-bottom:1px solid #DCE0DA\"><span style=\"font:400 9.5px 'IBM Plex Mono',monospace;color:rgba(18,33,26,.4);width:96px;flex:none\">15 / 500<\u002Fspan><span style=\"font:500 15px/1.35 Montserrat,sans-serif;color:#12211A\">Fila de lista, móvil<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:baseline;gap:14px;padding:10px 0;border-bottom:1px solid #DCE0DA\"><span style=\"font:400 9.5px 'IBM Plex Mono',monospace;color:rgba(18,33,26,.4);width:96px;flex:none\">13 / 500<\u002Fspan><span style=\"font:500 13px/1.35 Montserrat,sans-serif;color:#12211A\">Fila de lista, escritorio<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:baseline;gap:14px;padding:10px 0;border-bottom:1px solid #DCE0DA\"><span style=\"font:400 9.5px 'IBM Plex Mono',monospace;color:rgba(18,33,26,.4);width:96px;flex:none\">13 / 400<\u002Fspan><span style=\"font:400 13px/1.5 Montserrat,sans-serif;color:rgba(18,33,26,.62)\">Notas y texto secundario<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:baseline;gap:14px;padding:10px 0;border-bottom:1px solid #DCE0DA\"><span style=\"font:400 9.5px 'IBM Plex Mono',monospace;color:rgba(18,33,26,.4);width:96px;flex:none\">11 / 600<\u002Fspan><span style=\"font:600 11px/1.3 Montserrat,sans-serif;color:#12211A\">Etiqueta de equipo<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:baseline;gap:14px;padding:10px 0;border-bottom:1px solid #DCE0DA\"><span style=\"font:400 9.5px 'IBM Plex Mono',monospace;color:rgba(18,33,26,.4);width:96px;flex:none\">11 / mono<\u002Fspan><span style=\"font:400 11px/1.3 'IBM Plex Mono',monospace;color:#12211A\">04 oct · 1042 · 3 d<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"dv-note\" style=\"max-width:400px\">Segunda familia: IBM Plex Mono, sólo para cifras — fechas, folios de factura, lotes de tueste, días de atraso. Razón: en una lista densa los números deben alinearse en columna y distinguirse del texto sin negrita ni color; Montserrat no tiene cifras tabulares de ancho fijo. Nunca se usa para prosa ni para etiquetas decorativas.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"width:250px\">\n      <div style=\"font:600 10px/1 'IBM Plex Mono',monospace;letter-spacing:.04em;color:rgba(18,33,26,.45);margin-bottom:14px\">ESPACIO — base 4<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:6px;margin-bottom:26px\">\n        <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"font:400 9.5px 'IBM Plex Mono',monospace;color:rgba(18,33,26,.4);width:24px\">4<\u002Fspan><span style=\"height:10px;width:4px;background:#17573C\"><\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"font:400 9.5px 'IBM Plex Mono',monospace;color:rgba(18,33,26,.4);width:24px\">8<\u002Fspan><span style=\"height:10px;width:8px;background:#17573C\"><\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"font:400 9.5px 'IBM Plex Mono',monospace;color:rgba(18,33,26,.4);width:24px\">12<\u002Fspan><span style=\"height:10px;width:12px;background:#17573C\"><\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"font:400 9.5px 'IBM Plex Mono',monospace;color:rgba(18,33,26,.4);width:24px\">16<\u002Fspan><span style=\"height:10px;width:16px;background:#17573C\"><\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"font:400 9.5px 'IBM Plex Mono',monospace;color:rgba(18,33,26,.4);width:24px\">24<\u002Fspan><span style=\"height:10px;width:24px;background:#17573C\"><\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"font:400 9.5px 'IBM Plex Mono',monospace;color:rgba(18,33,26,.4);width:24px\">32<\u002Fspan><span style=\"height:10px;width:32px;background:#17573C\"><\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"font:400 9.5px 'IBM Plex Mono',monospace;color:rgba(18,33,26,.4);width:24px\">48<\u002Fspan><span style=\"height:10px;width:48px;background:#17573C\"><\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font:600 10px/1 'IBM Plex Mono',monospace;letter-spacing:.04em;color:rgba(18,33,26,.45);margin-bottom:14px\">RADIO<\u002Fdiv>\n      <div style=\"display:flex;align-items:flex-end;gap:10px\">\n        <div style=\"text-align:center\"><div style=\"width:44px;height:44px;background:#fff;border:1px solid #DCE0DA;border-radius:0\"><\u002Fdiv><div style=\"font:400 9.5px 'IBM Plex Mono',monospace;color:rgba(18,33,26,.4);margin-top:5px\">0<\u002Fdiv><\u002Fdiv>\n        <div style=\"text-align:center\"><div style=\"width:44px;height:44px;background:#fff;border:1px solid #DCE0DA;border-radius:3px\"><\u002Fdiv><div style=\"font:400 9.5px 'IBM Plex Mono',monospace;color:rgba(18,33,26,.4);margin-top:5px\">3<\u002Fdiv><\u002Fdiv>\n        <div style=\"text-align:center\"><div style=\"width:44px;height:44px;background:#fff;border:1px solid #DCE0DA;border-radius:6px\"><\u002Fdiv><div style=\"font:400 9.5px 'IBM Plex Mono',monospace;color:rgba(18,33,26,.4);margin-top:5px\">6<\u002Fdiv><\u002Fdiv>\n        <div style=\"text-align:center\"><div style=\"width:44px;height:44px;background:#fff;border:1px solid #DCE0DA;border-radius:14px\"><\u002Fdiv><div style=\"font:400 9.5px 'IBM Plex Mono',monospace;color:rgba(18,33,26,.4);margin-top:5px\">14<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"dv-note\" style=\"max-width:250px\">Radio 0 para filas y reglas, 3 para chips y campos, 6 para tarjetas de resultado, 14 sólo para el sheet de detalle. Tres tipos de contenido, tres formas distintas.<\u002Fp>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"dv-turn\" id=\"t3\">\n  <div class=\"dv-thd\"><a class=\"dv-tid\" href=\"#t3\">3<\u002Fa><span class=\"dv-tname\">Mensajes — grupo, directo y bot (390px)<\u002Fspan><\u002Fdiv>\n  <div class=\"dv-opts\">\n\n    <div class=\"dv-opt\" id=\"3a\">\n      <div class=\"dv-olabel\"><a class=\"dv-oid\" href=\"#3a\">3a<\u002Fa>Grupo — Operaciones<\u002Fdiv>\n      <div class=\"dv-card\" style=\"width:390px;height:800px;border-radius:0;background:#F7F8F6;display:flex;flex-direction:column;overflow:hidden\">\n        <div style=\"border-bottom:1px solid #DCE0DA;padding:12px 16px;display:flex;align-items:center;gap:11px;background:#F7F8F6\">\n          <span style=\"font:500 11px Montserrat,sans-serif;color:rgba(18,33,26,.5)\">Atrás<\u002Fspan>\n          <span style=\"width:30px;height:30px;border-radius:3px;background:#2A6884;color:#F7F8F6;font:600 10px Montserrat,sans-serif;display:flex;align-items:center;justify-content:center;flex:none\">OP<\u002Fspan>\n          <span style=\"flex:1\"><span style=\"display:block;font:600 14px Montserrat,sans-serif;color:#12211A\">Operaciones<\u002Fspan><span style=\"display:block;font:400 11px Montserrat,sans-serif;color:rgba(18,33,26,.5);margin-top:1px\">Diego, Jorge, Karla, María +1<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px\">\n          <div style=\"align-self:center;font:400 10.5px 'IBM Plex Mono',monospace;color:rgba(18,33,26,.4);padding:4px 0\">MIÉ 2 SEP<\u002Fdiv>\n          <div style=\"align-self:flex-start;max-width:82%\">\n            <div style=\"display:flex;align-items:center;gap:6px;margin-bottom:3px\"><span style=\"width:5px;height:5px;border-radius:3px;background:#2A6884\"><\u002Fspan><span style=\"font:600 11px Montserrat,sans-serif;color:rgba(18,33,26,.6)\">Jorge A.<\u002Fspan><\u002Fdiv>\n            <div style=\"background:#FFFFFF;border:1px solid #DCE0DA;border-radius:3px 14px 14px 14px;padding:10px 13px;font:400 14px/1.45 Montserrat,sans-serif;color:#12211A\">Llegó el empaque compostable pero vinieron 400 bolsas de 340 g, no 600. Adjunto la guía.<\u002Fdiv>\n            <div style=\"background:#FFFFFF;border:1px solid #DCE0DA;border-radius:14px;padding:6px;margin-top:5px;width:184px\">\n              <div style=\"height:126px;background:repeating-linear-gradient(135deg,#E3E7E1 0 6px,#EFF1ED 6px 12px);border-radius:9px;display:flex;align-items:center;justify-content:center;font:400 9px 'IBM Plex Mono',monospace;color:rgba(18,33,26,.5);text-align:center\">foto de la guía<br>de envío<\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;align-items:center;padding:6px 5px 2px\"><span style=\"font:400 10px 'IBM Plex Mono',monospace;color:rgba(18,33,26,.45)\">IMG_5120.jpg<\u002Fspan><span style=\"font:500 10px Montserrat,sans-serif;color:#17573C\">Adjuntar a tarea<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font:400 10px 'IBM Plex Mono',monospace;color:rgba(18,33,26,.4);margin-top:4px\">16:41<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"align-self:flex-start;max-width:82%\">\n            <div style=\"display:flex;align-items:center;gap:6px;margin-bottom:3px\"><span style=\"width:5px;height:5px;border-radius:3px;background:#5C6096\"><\u002Fspan><span style=\"font:600 11px Montserrat,sans-serif;color:rgba(18,33,26,.6)\">Karla S.<\u002Fspan><\u002Fdiv>\n            <div style=\"background:#FFFFFF;border:1px solid #DCE0DA;border-radius:3px 14px 14px 14px;padding:10px 13px;font:400 14px/1.45 Montserrat,sans-serif;color:#12211A\">¿Eso frena el embarque a Portland del 8?<\u002Fdiv>\n            <div style=\"font:400 10px 'IBM Plex Mono',monospace;color:rgba(18,33,26,.4);margin-top:4px\">16:44<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"align-self:flex-end;max-width:82%;display:flex;flex-direction:column;align-items:flex-end\">\n            <div style=\"background:#12211A;border-radius:14px 3px 14px 14px;padding:10px 13px;font:400 14px/1.45 Montserrat,sans-serif;color:#F7F8F6\">No. Sale con 400 y el resto va en el envío de octubre. Jorge, pedí la diferencia hoy.<\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:7px;margin-top:4px\"><span style=\"font:400 10px 'IBM Plex Mono',monospace;color:rgba(18,33,26,.4)\">16:52<\u002Fspan><span style=\"font:500 10px Montserrat,sans-serif;color:rgba(18,33,26,.45)\">visto por 4<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"align-self:stretch;display:flex;align-items:center;gap:10px;padding:6px 0\"><span style=\"flex:1;height:1px;background:#A8451C\"><\u002Fspan><span style=\"font:600 10px Montserrat,sans-serif;color:#A8451C\">2 mensajes nuevos<\u002Fspan><span style=\"flex:1;height:1px;background:#A8451C\ ">1c<\u002Fa> con quince atrasos»<\u002Fp>\n<\u002Fsection>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:1100}}\">class Component extends DCLogic {\n  state = { screen: 'hoy', sheet: false, verTodo: false, chat: 'idle', filtro: 'todas' };\n\n  tab(name) {\n    const on = this.state.screen === name;\n    return {\n      color: on ? '#12211A' : 'rgba(18,33,26,.42)',\n      weight: on ? 600 : 500,\n      bar: on ? '#12211A' : 'transparent'\n    };\n  }\n\n  enviar = () => {\n    this.setState({ chat: 'guardando' });\n    setTimeout(() => this.setState({ chat: 'guardado' }), 1400);\n  };\n\n  renderVals() {\n    const s = this.state;\n    const t = n => this.tab(n);\n    return {\n      isHoy: s.screen === 'hoy',\n      isChat: s.screen === 'chat',\n      isTareas: s.screen === 'tareas',\n      isArchivos: s.screen === 'archivos',\n      isEquipo: s.screen === 'equipo',\n      goHoy: () => this.setState({ screen: 'hoy' }),\n      goChat: () => this.setState({ screen: 'chat' }),\n      goTareas: () => this.setState({ screen: 'tareas' }),\n      goArchivos: () => this.setState({ screen: 'archivos' }),\n      goEquipo: () => this.setState({ screen: 'equipo' }),\n      tHoy: t('hoy'), tChat: t('chat'), tTareas: t('tareas'), tArchivos: t('archivos'), tEquipo: t('equipo'),\n      openSheet: () => this.setState({ sheet: true }),\n      closeSheet: () => this.setState({ sheet: false }),\n      sheetOpen: s.sheet,\n      verTodo: s.verTodo,\n      noVerTodo: !s.verTodo,\n      toggleVerTodo: () => this.setState({ verTodo: !s.verTodo }),\n      alcance: s.verTodo ? 'Toda la empresa' : 'Mis equipos',\n      conteo: s.verTodo ? '412 tareas' : '86 tareas',\n      knobX: s.verTodo ? 18 : 2,\n      knobBg: s.verTodo ? '#17573C' : '#C4CBC4',\n      enviar: this.enviar,\n      chatIdle: s.chat === 'idle',\n      chatEnviado: s.chat !== 'idle',\n      chatGuardando: s.chat === 'guardando',\n
